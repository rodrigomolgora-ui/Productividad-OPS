<style>
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8eaf0;--text2:#8b909e;--text3:#555b6b;--gold:#fbbf24;--silver:#94a3b8;--bronze:#b45309;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem;}
.container{max-width:1060px;margin:0 auto;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.header .week{font-size:12px;color:var(--text2);}

/* TABS */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid var(--border);}
.tab{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:8px 16px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;border-radius:6px 6px 0 0;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--text);border-bottom-color:#3b82f6;background:rgba(59,130,246,0.06);}
.tab.empty{opacity:.4;cursor:default;}
.tab.medal{color:var(--gold);}
.tab.medal.active{border-bottom-color:var(--gold);background:rgba(251,191,36,0.06);}

/* PANEL */
.panel{display:none;}.panel.active{display:block;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.2rem;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#3b82f6,transparent);opacity:0.5;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-0.5px;}

/* CONTROLS */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem;}
.filters{display:flex;gap:5px;flex-wrap:wrap;}
.fb{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:4px 13px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.fb:hover{color:var(--text);}
.fb.active{background:rgba(255,255,255,0.08);color:var(--text);border-color:rgba(255,255,255,0.2);}
.search-wrap{flex:1;min-width:180px;}
.search-wrap input{font-family:'DM Sans',sans-serif;width:100%;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);outline:none;}
.search-wrap input:focus{border-color:#3b82f6;}
.search-wrap input::placeholder{color:var(--text3);}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{border-bottom:1px solid var(--border2);}
th{padding:9px 14px;font-size:10px;font-weight:600;color:var(--text3);text-align:left;white-space:nowrap;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.5px;background:var(--bg2);}
th.right{text-align:right;}
.sa{font-size:10px;margin-left:3px;opacity:.4;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.025);}
td{padding:10px 14px;vertical-align:middle;background:var(--bg2);}
td.right{text-align:right;}
.rep-name{font-weight:500;}
.proc-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;text-transform:uppercase;}
.util-row{display:flex;align-items:center;gap:8px;}
.util-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.07);overflow:hidden;min-width:40px;}
.util-fill{height:100%;border-radius:2px;}
.util-v{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;min-width:40px;text-align:right;}
.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);}
tfoot td{background:var(--bg3);font-size:11px;color:var(--text2);border-top:1px solid var(--border2);padding:8px 14px;}
.empty-day{text-align:center;padding:4rem 2rem;color:var(--text3);}
.empty-day .icon{font-size:32px;margin-bottom:.5rem;}

/* MEDALLERO */
.medal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:1.5rem;}
.medal-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.medal-card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);display:flex;align-items:center;gap:8px;}
.medal-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);}
.medal-row:last-child{border-bottom:none;}
.medal-pos{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;width:20px;text-align:center;}
.pos-1{color:var(--gold);}
.pos-2{color:var(--silver);}
.pos-3{color:var(--bronze);}
.medal-name{flex:1;font-size:13px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.medal-proc{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;text-transform:uppercase;margin-left:4px;}
.medal-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--text);}
.medal-day{font-size:10px;color:var(--text3);margin-left:4px;}
.week-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem;}
.ws{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.ws-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.ws-val{font-size:20px;font-weight:700;}
</style>
</head>

// ═══════════════════════════════════════════════════════
// RENDER TABS + PANELS
// ═══════════════════════════════════════════════════════
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
let activeTab=0;
let dayStates=SEMANA.map(()=>({af:'all',sv:'',sk:'prod',sa:false}));

SEMANA.forEach((dia,i)=>{
  // Tab
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'')+(dia.data.length===0?' empty':'');
  t.textContent=dia.label;
  t.onclick=()=>switchTab(i);
  tabsEl.appendChild(t);

  // Panel
  const p=document.createElement('div');
  p.className='panel'+(i===0?' active':'');
  p.id='panel-'+i;
  p.innerHTML=renderDay(i);
  panelsEl.appendChild(p);
});

// Medallero tab
const mt=document.createElement('button');
mt.className='tab medal';
mt.textContent='🏆 Medallero';
mt.onclick=()=>switchTab('medal');
tabsEl.appendChild(mt);
const mp=document.createElement('div');
mp.className='panel';
mp.id='panel-medal';
mp.innerHTML=renderMedallero();
panelsEl.appendChild(mp);

function switchTab(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(idx==='medal'?SEMANA.length:idx)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(idx==='medal'?'panel-medal':'panel-'+idx).classList.add('active');
  activeTab=idx;
}

function renderDay(i){
  const dia=SEMANA[i];
  if(dia.data.length===0) return `<div class="empty-day"><div class="icon">📭</div><div>Sin actividad registrada · ${dia.fecha}</div></div>`;
  const st=dayStates[i];
  const rows=dia.data.map(r=>({nombre:r[0],proceso:r[1],prod:r[2],util:r[3],tiempo:r[4],unidades:r[5]}));
  const prods=rows.map(r=>r.prod).filter(v=>v>0);
  const utils=rows.map(r=>r.util).filter(v=>v>0);
  const totalU=rows.reduce((a,r)=>a+r.unidades,0);
  const avgP=prods.length?(prods.reduce((a,b)=>a+b,0)/prods.length).toFixed(0):'-';
  const avgU=utils.length?(utils.reduce((a,b)=>a+b,0)/utils.length).toFixed(1)+'%':'-';
  const procs=['all',...Object.keys(PC)];
  const filterBtns=procs.map(p=>`<button class="fb${st.af===p?' active':''}" onclick="setFilter(${i},'${p}')">${p==='all'?'Todos':p}</button>`).join('');
  return `
  <div class="stats">
    <div class="stat"><div class="stat-label">Registros</div><div class="stat-val">${rows.length}</div></div>
    <div class="stat"><div class="stat-label">Prod. neta prom.</div><div class="stat-val">${avgP}</div></div>
    <div class="stat"><div class="stat-label">Util. prom.</div><div class="stat-val">${avgU}</div></div>
    <div class="stat"><div class="stat-label">Total unidades</div><div class="stat-val">${totalU.toLocaleString('es-MX')}</div></div>
  </div>
  <div class="controls">
    <div class="filters">${filterBtns}</div>
    <div class="search-wrap"><input type="search" placeholder="Buscar representante…" value="${st.sv}" oninput="setSearch(${i},this.value)"></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr>
      <th onclick="sortDay(${i},'nombre')">Representante <span class="sa">↕</span></th>
      <th onclick="sortDay(${i},'proceso')">Proceso <span class="sa">↕</span></th>
      <th class="right" onclick="sortDay(${i},'prod')">Prod. neta <span class="sa">↕</span></th>
      <th onclick="sortDay(${i},'util')">Utilización <span class="sa">↕</span></th>
      <th onclick="sortDay(${i},'tiempo')">T. proceso <span class="sa">↕</span></th>
      <th class="right" onclick="sortDay(${i},'unidades')">Unidades <span class="sa">↕</span></th>
    </tr></thead>
    <tbody>${renderRows(i)}</tbody>
    <tfoot><tr><td colspan="2">Promedio / Total visible</td><td style="text-align:right" id="fp-${i}"></td><td id="fu-${i}"></td><td></td><td style="text-align:right" id="fuu-${i}"></td></tr></tfoot>
  </table></div>`;
}

function renderRows(i){
  const st=dayStates[i];
  let rows=SEMANA[i].data.map(r=>({nombre:r[0],proceso:r[1],prod:r[2],util:r[3],tiempo:r[4],unidades:r[5]}));
  rows=rows.filter(r=>(st.af==='all'||r.proceso===st.af)&&(!st.sv||r.nombre.toLowerCase().includes(st.sv)));
  rows.sort((a,b)=>{let va=a[st.sk],vb=b[st.sk];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}return st.sa?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);});
  const html=rows.map(r=>{
    const[c,bg,br]=gc(r.proceso);const u=uc(r.util);const up=Math.min(r.util,100);
    return `<tr><td><span class="rep-name">${r.nombre}</span></td><td><span class="proc-badge" style="color:${c};background:${bg};border:1px solid ${br}">${r.proceso}</span></td><td class="right"><span class="mono">${r.prod}</span></td><td><div class="util-row"><div class="util-bar"><div class="util-fill" style="width:${up}%;background:${u}"></div></div><span class="util-v" style="color:${u}">${r.util>0?r.util.toFixed(1)+'%':'—'}</span></div></td><td><span class="mono">${r.tiempo}</span></td><td class="right"><span class="mono">${r.unidades.toLocaleString('es-MX')}</span></td></tr>`;
  }).join('');
  setTimeout(()=>{
    const vp=rows.map(r=>r.prod).filter(v=>v>0);
    const vu=rows.map(r=>r.util).filter(v=>v>0);
    const fp=document.getElementById('fp-'+i);if(fp)fp.textContent=vp.length?(vp.reduce((a,b)=>a+b,0)/vp.length).toFixed(0):'-';
    const fu=document.getElementById('fu-'+i);if(fu)fu.textContent=vu.length?(vu.reduce((a,b)=>a+b,0)/vu.length).toFixed(1)+'%':'-';
    const fuu=document.getElementById('fuu-'+i);if(fuu)fuu.textContent=rows.reduce((a,r)=>a+r.unidades,0).toLocaleString('es-MX');
  },0);
  return html||'<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text3)">Sin resultados</td></tr>';
}

function setFilter(i,f){dayStates[i].af=f;refreshDay(i);}
function setSearch(i,v){dayStates[i].sv=v.toLowerCase().trim();refreshDay(i);}
function sortDay(i,k){const st=dayStates[i];st.sa=st.sk===k?!st.sa:false;st.sk=k;refreshDay(i);}
function refreshDay(i){document.getElementById('panel-'+i).innerHTML=renderDay(i);}

// ═══════════════════════════════════════════════════════
// MEDALLERO
// ═══════════════════════════════════════════════════════
function renderMedallero(){
  // Juntar todos los datos con etiqueta de día
  const all=[];
  SEMANA.forEach(dia=>{
    if(!dia.data.length) return;
    dia.data.forEach(r=>{
      all.push({nombre:r[0],proceso:r[1],prod:r[2],util:r[3],unidades:r[5],dia:dia.label});
    });
  });
  if(!all.length) return '<div class="empty-day"><div class="icon">🏆</div><div>Sin datos suficientes aún</div></div>';

  // Stats globales de la semana
  const totalU=all.reduce((a,r)=>a+r.unidades,0);
  const prods=all.filter(r=>r.prod>0).map(r=>r.prod);
  const utils=all.filter(r=>r.util>0).map(r=>r.util);
  const avgP=prods.length?(prods.reduce((a,b)=>a+b,0)/prods.length).toFixed(0):'-';
  const avgU=utils.length?(utils.reduce((a,b)=>a+b,0)/utils.length).toFixed(1)+'%':'-';
  const dias=SEMANA.filter(d=>d.data.length>0).length;

  // Top 5 prod neta
  const topProd=[...all].filter(r=>r.prod>0).sort((a,b)=>b.prod-a.prod).slice(0,5);
  // Top 5 utilización
  const topUtil=[...all].filter(r=>r.util>0).sort((a,b)=>b.util-a.util).slice(0,5);
  // Top 5 unidades
  const topUnid=[...all].filter(r=>r.unidades>0).sort((a,b)=>b.unidades-a.unidades).slice(0,5);
  // Top acumulado por nombre (suma de unidades en toda la semana)
  const byName={};
  all.forEach(r=>{if(!byName[r.nombre])byName[r.nombre]={nombre:r.nombre,unidades:0,dias:new Set()};byName[r.nombre].unidades+=r.unidades;byName[r.nombre].dias.add(r.dia);});
  const topAcum=Object.values(byName).sort((a,b)=>b.unidades-a.unidades).slice(0,5);

  function medal(pos){const cls=['pos-1','pos-2','pos-3'][pos]||'';return `<span class="medal-pos ${cls}">${['🥇','🥈','🥉'][pos]||pos+1}</span>`;}
  function badge(p){const[c,bg,br]=gc(p);return `<span class="medal-proc" style="color:${c};background:${bg};border:1px solid ${br}">${p}</span>`;}

  function card(title,icon,rows,valFn,suffix=''){
    return `<div class="medal-card">
      <div class="medal-card-header">${icon} ${title}</div>
      ${rows.map((r,i)=>`<div class="medal-row">${medal(i)}<span class="medal-name">${r.nombre}${r.proceso?badge(r.proceso):''}</span><span class="medal-val">${valFn(r)}${suffix}</span><span class="medal-day">${r.dia||''}</span></div>`).join('')}
    </div>`;
  }
  function cardAcum(title,icon,rows){
    return `<div class="medal-card">
      <div class="medal-card-header">${icon} ${title}</div>
      ${rows.map((r,i)=>`<div class="medal-row">${medal(i)}<span class="medal-name">${r.nombre}</span><span class="medal-val">${r.unidades.toLocaleString('es-MX')}</span><span class="medal-day">${r.dias.size} día${r.dias.size>1?'s':''}</span></div>`).join('')}
    </div>`;
  }

  return `
  <div class="week-summary">
    <div class="ws"><div class="ws-label">Días con datos</div><div class="ws-val">${dias}</div></div>
    <div class="ws"><div class="ws-label">Total registros</div><div class="ws-val">${all.length}</div></div>
    <div class="ws"><div class="ws-label">Prod. prom. semana</div><div class="ws-val">${avgP}</div></div>
    <div class="ws"><div class="ws-label">Util. prom. semana</div><div class="ws-val">${avgU}</div></div>
    <div class="ws"><div class="ws-label">Unidades semana</div><div class="ws-val">${totalU.toLocaleString('es-MX')}</div></div>
  </div>
  <div class="medal-grid">
    ${card('Mayor prod. neta (turno)','⚡',topProd,r=>r.prod)}
    ${card('Mayor utilización (turno)','🎯',topUtil,r=>r.util.toFixed(1),'%')}
    ${card('Mayor unidades (turno)','📦',topUnid,r=>r.unidades.toLocaleString('es-MX'))}
    ${cardAcum('Unidades acumuladas semana','🏅',topAcum)}
  </div>`;
}

// Sort inicial por prod desc
SEMANA.forEach((_,i)=>{dayStates[i].sa=false;dayStates[i].sk='prod';});
</script>
