<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Productividad OPS — Semana</title>

<style>
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8eaf0;--text2:#8b909e;--text3:#555b6b;--gold:#fbbf24;--silver:#94a3b8;--bronze:#cd7c3a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem;}
.container{max-width:1100px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.header .week{font-size:12px;color:var(--text2);}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid var(--border);}
.tab{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:8px 16px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;border-radius:6px 6px 0 0;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--text);border-bottom-color:#3b82f6;background:rgba(59,130,246,0.06);}
.tab.empty{opacity:.35;cursor:default;}
.tab.medal{color:var(--gold);}
.tab.medal.active{border-bottom-color:var(--gold);background:rgba(251,191,36,0.06);}
.panel{display:none;}.panel.active{display:block;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.2rem;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#3b82f6,transparent);opacity:.5;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem;}
.filters{display:flex;gap:5px;flex-wrap:wrap;}
.fb{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:4px 13px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.fb:hover{color:var(--text);}
.fb.active{background:rgba(255,255,255,0.08);color:var(--text);border-color:rgba(255,255,255,0.2);}
.search-wrap{flex:1;min-width:180px;}
.search-wrap input{font-family:'DM Sans',sans-serif;width:100%;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);outline:none;}
.search-wrap input:focus{border-color:#3b82f6;}
.search-wrap input::placeholder{color:var(--text3);}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{border-bottom:1px solid var(--border2);}
th{padding:9px 14px;font-size:10px;font-weight:600;color:var(--text3);text-align:left;white-space:nowrap;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.5px;background:var(--bg2);}
th.right{text-align:right;}
.sa{font-size:10px;margin-left:3px;opacity:.4;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.025);}
td{padding:10px 14px;vertical-align:middle;background:var(--bg2);}
td.right{text-align:right;}
.rep-name{font-weight:500;}
.proc-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;text-transform:uppercase;}
.util-row{display:flex;align-items:center;gap:8px;}
.util-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.07);overflow:hidden;min-width:40px;}
.util-fill{height:100%;border-radius:2px;}
.util-v{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;min-width:40px;text-align:right;}
.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);}
tfoot td{background:var(--bg3);font-size:11px;color:var(--text2);border-top:1px solid var(--border2);padding:8px 14px;}
.empty-day{text-align:center;padding:4rem 2rem;color:var(--text3);}
.empty-day .icon{font-size:32px;margin-bottom:.5rem;}
.medal-section-title{font-size:16px;font-weight:700;margin:2rem 0 1rem;letter-spacing:-0.3px;display:flex;align-items:center;gap:.5rem;}
.medal-section-title span{font-size:13px;font-weight:400;color:var(--text2);}
.podios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin-bottom:.5rem;}
.podio-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;padding:16px;}
.podio-proc-header{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.podio-proc-dot{width:10px;height:10px;border-radius:50%;}
.podio-proc-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.podio-proc-sub{font-size:10px;color:var(--text3);margin-left:4px;font-weight:400;text-transform:none;letter-spacing:0;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:130px;margin-bottom:12px;}
.podium-place{display:flex;flex-direction:column;align-items:center;flex:1;max-width:90px;}
.podium-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:4px;flex-shrink:0;}
.podium-name{font-size:9px;font-weight:600;text-align:center;line-height:1.2;color:var(--text2);max-width:80px;word-break:break-word;margin-bottom:4px;min-height:22px;display:flex;align-items:flex-end;justify-content:center;}
.podium-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;margin-bottom:4px;}
.podium-block{width:100%;border-radius:6px 6px 0 0;}
.place-1 .podium-block{height:75px;}
.place-2 .podium-block{height:55px;}
.place-3 .podium-block{height:40px;}
.place-1 .podium-avatar{background:rgba(251,191,36,0.2);color:var(--gold);}
.place-1 .podium-val{color:var(--gold);}
.place-1 .podium-block{background:linear-gradient(180deg,rgba(251,191,36,0.25),rgba(251,191,36,0.08));}
.place-2 .podium-avatar{background:rgba(148,163,184,0.2);color:var(--silver);}
.place-2 .podium-val{color:var(--silver);}
.place-2 .podium-block{background:linear-gradient(180deg,rgba(148,163,184,0.2),rgba(148,163,184,0.06));}
.place-3 .podium-avatar{background:rgba(205,124,58,0.2);color:var(--bronze);}
.place-3 .podium-val{color:var(--bronze);}
.place-3 .podium-block{background:linear-gradient(180deg,rgba(205,124,58,0.2),rgba(205,124,58,0.06));}
.podium-base{height:1px;background:var(--border2);margin:0 -16px;}
.no-data-podio{text-align:center;color:var(--text3);font-size:12px;padding:2rem 0;}
.week-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:2rem;}
.wb{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.wb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6;}
.wb.dias::before{background:linear-gradient(90deg,#3b82f6,transparent);}
.wb.pack::before{background:linear-gradient(90deg,#60a5fa,transparent);}
.wb.picking::before{background:linear-gradient(90deg,#34d399,transparent);}
.wb-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.wb-val{font-size:20px;font-weight:700;}
.wb-sub{font-size:10px;color:var(--text3);margin-top:2px;}
</style>
</head>

const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
let dayStates=SEMANA.map(()=>({af:'all',sv:'',sk:'prod',sa:false}));

SEMANA.forEach((dia,i)=>{
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'')+(dia.data.length===0?' empty':'');
  t.textContent=dia.label;
  if(dia.data.length>0)t.onclick=()=>switchTab(i);
  tabsEl.appendChild(t);

  const p=document.createElement('div');
  p.className='panel'+(i===0?' active':'');
  p.id='panel-'+i;
  panelsEl.appendChild(p);
  if(dia.data.length>0) buildDayPanel(i);
  else p.innerHTML='<div class="empty-day"><div class="icon">📭</div><div>Sin actividad · '+dia.fecha+'</div></div>';
});

const mt=document.createElement('button');
mt.className='tab medal';
mt.textContent='🏆 Medallero';
mt.onclick=()=>switchTab('medal');
tabsEl.appendChild(mt);
const mp=document.createElement('div');
mp.className='panel';
mp.id='panel-medal';
mp.innerHTML=renderMedallero();
panelsEl.appendChild(mp);

function switchTab(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(idx==='medal'?SEMANA.length:idx)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(idx==='medal'?'panel-medal':'panel-'+idx).classList.add('active');
}

function buildDayPanel(i){
  const dia=SEMANA[i];
  const rows=dia.data.map(r=>({nombre:r[0],proceso:r[1],prod:r[2],util:r[3],tiempo:r[4],unidades:r[5]}));
  const prods=rows.filter(r=>r.prod>0).map(r=>r.prod);
  const utils=rows.filter(r=>r.util>0).map(r=>r.util);
  const totalU=rows.reduce((a,r)=>a+r.unidades,0);
  const avgP=prods.length?(prods.reduce((a,b)=>a+b,0)/prods.length).toFixed(0):'-';
  const avgU=utils.length?(utils.reduce((a,b)=>a+b,0)/utils.length).toFixed(1)+'%':'-';
  const procs=['all',...Object.keys(PC)];

  const p=document.getElementById('panel-'+i);
  p.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="stat-label">Registros</div><div class="stat-val">${rows.length}</div></div>
    <div class="stat"><div class="stat-label">Prod. neta prom.</div><div class="stat-val">${avgP}</div></div>
    <div class="stat"><div class="stat-label">Util. prom.</div><div class="stat-val">${avgU}</div></div>
    <div class="stat"><div class="stat-label">Total unidades</div><div class="stat-val">${totalU.toLocaleString('es-MX')}</div></div>
  </div>
  <div class="controls">
    <div class="filters" id="filters-${i}"></div>
    <div class="search-wrap"><input type="search" id="search-${i}" placeholder="Buscar representante…" autocomplete="off"></div>
  </div>
  <div class="table-wrap"><table>
    <thead><tr>
      <th onclick="sortDay(${i},'nombre')">Representante <span class="sa" id="sa-${i}-nombre">↕</span></th>
      <th onclick="sortDay(${i},'proceso')">Proceso <span class="sa" id="sa-${i}-proceso">↕</span></th>
      <th class="right" onclick="sortDay(${i},'prod')">Prod. neta <span class="sa" id="sa-${i}-prod">↕</span></th>
      <th onclick="sortDay(${i},'util')">Utilización <span class="sa" id="sa-${i}-util">↕</span></th>
      <th onclick="sortDay(${i},'tiempo')">T. proceso <span class="sa" id="sa-${i}-tiempo">↕</span></th>
      <th class="right" onclick="sortDay(${i},'unidades')">Unidades <span class="sa" id="sa-${i}-unidades">↕</span></th>
    </tr></thead>
    <tbody id="tbody-${i}"></tbody>
    <tfoot><tr>
      <td colspan="2">Promedio / Total visible</td>
      <td style="text-align:right" id="fp-${i}"></td>
      <td id="fu-${i}"></td>
      <td></td>
      <td style="text-align:right" id="fuu-${i}"></td>
    </tr></tfoot>
  </table></div>`;

  const flt=document.getElementById('filters-'+i);
  procs.forEach(pr=>{
    const b=document.createElement('button');
    b.className='fb'+(pr==='all'?' active':'');
    b.textContent=pr==='all'?'Todos':pr;
    if(pr!=='all'){const[c,,br]=gc(pr);b.style.color=c;b.style.borderColor=br;}
    b.onclick=()=>setFilter(i,pr);
    flt.appendChild(b);
  });

  const inp=document.getElementById('search-'+i);
  inp.addEventListener('input',()=>{
    dayStates[i].sv=inp.value.toLowerCase().trim();
    refreshRows(i);
  });

  refreshRows(i);
}

function setFilter(i,f){
  dayStates[i].af=f;
  const flt=document.getElementById('filters-'+i);
  flt.querySelectorAll('.fb').forEach(b=>{
    const isAll=b.textContent==='Todos';
    const match=(isAll&&f==='all')||b.textContent===f;
    b.classList.toggle('active',match);
    if(!isAll){
      const[c,bg,br]=gc(b.textContent);
      b.style.background=match?bg:'';
      b.style.color=c;
      b.style.borderColor=br;
    }
  });
  refreshRows(i);
}

function sortDay(i,k){
  const st=dayStates[i];
  st.sa=st.sk===k?!st.sa:false;
  st.sk=k;
  ['nombre','proceso','prod','util','tiempo','unidades'].forEach(col=>{
    const el=document.getElementById('sa-'+i+'-'+col);
    if(el) el.textContent=col===k?(st.sa?'↑':'↓'):'↕';
  });
  refreshRows(i);
}

function refreshRows(i){
  const st=dayStates[i];
  let rows=SEMANA[i].data.map(r=>({nombre:r[0],proceso:r[1],prod:r[2],util:r[3],tiempo:r[4],unidades:r[5]}));
  rows=rows.filter(r=>(st.af==='all'||r.proceso===st.af)&&(!st.sv||r.nombre.toLowerCase().includes(st.sv)));
  rows.sort((a,b)=>{
    let va=a[st.sk],vb=b[st.sk];
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    return st.sa?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);
  });

  const tbody=document.getElementById('tbody-'+i);
  if(!tbody) return;

  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text3)">Sin resultados</td></tr>';
  } else {
    tbody.innerHTML=rows.map(r=>{
      const[c,bg,br]=gc(r.proceso);
      const u=uc(r.util);
      const up=Math.min(r.util,100);
      return `<tr>
        <td><span class="rep-name">${r.nombre}</span></td>
        <td><span class="proc-badge" style="color:${c};background:${bg};border:1px solid ${br}">${r.proceso}</span></td>
        <td class="right"><span class="mono">${r.prod}</span></td>
        <td><div class="util-row"><div class="util-bar"><div class="util-fill" style="width:${up}%;background:${u}"></div></div><span class="util-v" style="color:${u}">${r.util>0?r.util.toFixed(1)+'%':'—'}</span></div></td>
        <td><span class="mono">${r.tiempo}</span></td>
        <td class="right"><span class="mono">${r.unidades.toLocaleString('es-MX')}</span></td>
      </tr>`;
    }).join('');
  }

  const vp=rows.filter(r=>r.prod>0).map(r=>r.prod);
  const vu=rows.filter(r=>r.util>0).map(r=>r.util);
  const fp=document.getElementById('fp-'+i);if(fp)fp.textContent=vp.length?(vp.reduce((a,b)=>a+b,0)/vp.length).toFixed(0):'-';
  const fu=document.getElementById('fu-'+i);if(fu)fu.textContent=vu.length?(vu.reduce((a,b)=>a+b,0)/vu.length).toFixed(1)+'%':'-';
  const fuu=document.getElementById('fuu-'+i);if(fuu)fuu.textContent=rows.reduce((a,r)=>a+r.unidades,0).toLocaleString('es-MX');
}

function renderMedallero(){
  const all=[];
  SEMANA.forEach(dia=>dia.data.forEach(r=>{
    const proc=r[1]==='Pack'?packSubtipo(r[2]):r[1];
    all.push({nombre:r[0],proceso:proc,prod:r[2],util:r[3],unidades:r[5]});
  }));
  if(!all.length)return '<div class="empty-day"><div class="icon">🏆</div><div>Sin datos aún</div></div>';

  const dias=SEMANA.filter(d=>d.data.length>0).length;
  const pzsPack=all.filter(r=>r.proceso==='Pack Mono'||r.proceso==='Pack PTW').reduce((a,r)=>a+r.unidades,0);
  const pzsPicking=all.filter(r=>r.proceso==='Picking').reduce((a,r)=>a+r.unidades,0);

  function topProdProm(proc){
    const map={};
    all.filter(r=>r.proceso===proc&&r.prod>0).forEach(r=>{
      if(!map[r.nombre])map[r.nombre]={nombre:r.nombre,total:0,count:0};
      map[r.nombre].total+=r.prod;map[r.nombre].count++;
    });
    return Object.values(map).map(r=>({nombre:r.nombre,val:r.total/r.count})).sort((a,b)=>b.val-a.val).slice(0,3);
  }
  function topUnidades(proc){
    const map={};
    all.filter(r=>r.proceso===proc&&r.unidades>0).forEach(r=>{
      if(!map[r.nombre])map[r.nombre]={nombre:r.nombre,val:0};
      map[r.nombre].val+=r.unidades;
    });
    return Object.values(map).sort((a,b)=>b.val-a.val).slice(0,3);
  }
  function podiumHTML(top,fmt){
    if(!top.length)return '<div class="no-data-podio">Sin datos suficientes</div>';
    const places=[];
    if(top[1])places.push({d:top[1],cls:'place-2',em:'🥈'});
    places.push({d:top[0],cls:'place-1',em:'🥇'});
    if(top[2])places.push({d:top[2],cls:'place-3',em:'🥉'});
    return `<div class="podium">${places.map(({d,cls,em})=>`<div class="podium-place ${cls}"><div class="podium-avatar">${em}</div><div class="podium-name">${d.nombre.split(' ').slice(0,2).join(' ')}</div><div class="podium-val">${fmt(d.val)}</div><div class="podium-block"></div></div>`).join('')}</div><div class="podium-base"></div>`;
  }
  function procCard(proc,top,fmt,sub=''){
    const[c]=gcm(proc);
    return `<div class="podio-card"><div class="podio-proc-header"><div class="podio-proc-dot" style="background:${c}"></div><span class="podio-proc-name" style="color:${c}">${proc}</span>${sub?`<span class="podio-proc-sub">${sub}</span>`:''}</div>${podiumHTML(top,fmt)}</div>`;
  }
  const procesosMedal=['Pack Mono','Pack PTW','P2S','Picking','Batch','Wallin','HU'];
  const subLabels={'Pack Mono':'prod < 300','Pack PTW':'prod ≥ 300'};
  const prodCards=procesosMedal.map(p=>procCard(p,topProdProm(p),v=>v.toFixed(0),subLabels[p]||'')).join('');
  const unidCards=procesosMedal.map(p=>procCard(p,topUnidades(p),v=>v.toLocaleString('es-MX'),subLabels[p]||'')).join('');

  return `<div class="week-bar">
    <div class="wb dias"><div class="wb-label">Días con registros</div><div class="wb-val">${dias}</div><div class="wb-sub">de 7 en la semana</div></div>
    <div class="wb pack"><div class="wb-label">Pzas acumuladas en Pack</div><div class="wb-val">${pzsPack.toLocaleString('es-MX')}</div><div class="wb-sub">semana al momento</div></div>
    <div class="wb picking"><div class="wb-label">Pzas acumuladas en Picking</div><div class="wb-val">${pzsPicking.toLocaleString('es-MX')}</div><div class="wb-sub">semana al momento</div></div>
  </div>
  <div class="medal-section-title">⚡ Top 3 — Productividad Neta Promedio <span>por proceso · semana al momento</span></div>
  <div class="podios-grid">${prodCards}</div>
  <div class="medal-section-title">📦 Top 3 — Unidades Acumuladas <span>por proceso · semana al momento</span></div>
  <div class="podios-grid">${unidCards}</div>`;
}
